        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='appointments' AND c.relname IN ('idx_appointments_dentist_id_start_at','idx_appointments_patient_id_start_at','idx_appointments_created_at_appointment_id')"
